<!DOCTYPE html>
<html>
<head>
    <title>Variabel Javascript</title>
</head>
<body>
    <h2>Program Pengenalan Variabel Javascript</h2>
    <script>
        // Membuat variabel
        let nama = "Muhammad Dede Yusuf Firdaus";
        let umur = 18;
        let tinggi = 173.1;
        let sudahMenikah = false;

        document.write("Nama: " + nama + " | Tipe : " + typeof nama + "<br>");
        document.write("Umur: " + umur + " | Tipe : " + typeof umur + "<br>");
        document.write("Tinggi: " + tinggi + " cm | Tipe : " + typeof tinggi + "<br>");
        document.write("Sudah menikah? " + sudahMenikah + " | Tipe : " + typeof sudahMenikah);
    </script>
</body>
</html>
